server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: knowflow-ai
  datasource:
    url: jdbc:mysql://localhost:3306/knowflow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

knowflow:
  jwt:
    secret: "change-this-development-secret-to-at-least-32-bytes"
    ttl-minutes: 1440
  upload:
    root: ./data/uploads
  rag:
    top-k: 5
    min-score: 0.05

logging:
  level:
    com.knowflow: info
