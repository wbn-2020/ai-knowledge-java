server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: knowflow-ai
  datasource:
    url: jdbc:mysql://localhost:3306/knowflow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: wbn123..
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

knowflow:
  jwt:
    secret: "change-this-development-secret-to-at-least-32-bytes"
    ttl-minutes: 1440
  upload:
    root: ./data/uploads
  rag:
    top-k: 5
    min-score: 0.05
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-reasoner

logging:
  level:
    com.knowflow: info
